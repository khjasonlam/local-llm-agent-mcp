[project]
name = "llm-agent-mcp-handson"
version = "0.1.0"
description = "ローカルLLM・Agent・MCP 勉強会の教材"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6.1",   # Ollama 公式の Python ライブラリ（0.6.1 以降で確率 logprobs が取れる）
    "openai>=2",       # OpenAI 互換の書き方（2.2）で使う
    "pypdf>=5",        # PDF から文字を取り出す（3.4）
    "mcp>=2.3,<3",     # MCP 公式の Python ライブラリ（第3回のサーバー側で使う。2.x で書き方が変わったので 2.x に固定）
]

[tool.uv]
package = false

# エディタの型チェック（Pyright）の設定
[tool.pyright]
typeCheckingMode = "standard"   # 標準の厳しさにする
# 回ごとに _common.py があるので、それぞれのフォルダの _common を見つけるように分ける
executionEnvironments = [
    { root = "session1", extraPaths = ["session1"] },
    { root = "session2", extraPaths = ["session2"] },
    { root = "session3", extraPaths = ["session3"] },
]
