# 参加者に配る zip を作り、リリース「handson」に添付し直す。
# 配布リンク（releases/latest/download/llm-agent-mcp-handson.zip）は、いつもこの最新の zip を指す。
name: 配布用 zip を更新

on:
  push:
    branches: [main]
    paths:                       # 配る中身が変わったときだけ動かす
      - "session*/**"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "internal/tools/make_zip.py"
      - "internal/tools/check_zip.py"
      - ".github/workflows/release-zip.yml"
  workflow_dispatch:             # Actions の画面から手動でも動かせる

permissions:
  contents: read

concurrency:                     # 続けて push したときは、順番に動かして最後の1回を反映する
  group: release-zip-${{ github.ref }}
  cancel-in-progress: false      # 差し替えは古い zip を消してから行うので、途中で止めるとリンクが切れる

jobs:
  # 参加者の PC に近い環境で、zip を展開して起動できるかを確かめる
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false           # 1つ失敗しても、ほかの組み合わせの結果も見る
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.10", "3.15"] # 対応する最も古い版と、uv が選びうる最新の版
    env:
      UV_PYTHON: ${{ matrix.python }}
      PYTHONUTF8: "1"            # Windows のランナーで日本語の表示に失敗しないようにする
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: zip を展開して動かす
        run: uv run internal/tools/check_zip.py

  # Python 3.10 に無い機能を使っていないか、型の間違いがないかを確かめる
  types:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.10"          # pyright は環境の Python の標準ライブラリを見るので、3.10 の環境で動かす
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: 型チェック
        run: uvx pyright@1.1.414 --pythonpath .venv/bin/python session1 internal/tools

  zip:
    needs: [check, types]        # 確認に失敗したら差し替えず、前の zip を残す
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write            # リリースの作成・ファイルの差し替えに必要
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: handson
    steps:
      - uses: actions/checkout@v7

      - name: zip を作る
        run: python3 internal/tools/make_zip.py   # 標準ライブラリだけで動く

      - name: リリースがなければ作る
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "勉強会の教材" --latest \
              --notes "勉強会で使う教材です。llm-agent-mcp-handson.zip をダウンロードしてください。"

      - name: zip を差し替える
        run: gh release upload "$TAG" dist/llm-agent-mcp-handson.zip --clobber
